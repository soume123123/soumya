<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITC Collaboration</title>
    <style>
        :root { color-scheme: light; font-family: "72", "Segoe UI", sans-serif; color: #17231e; background: #f3f6f3; }
        * { box-sizing: border-box; }
        body { min-width: 320px; min-height: 100vh; margin: 0; background: linear-gradient(135deg, #e7f0e9, #f8f8f4 52%, #edf1f5); }
        header { display: flex; align-items: center; justify-content: space-between; min-height: 68px; padding: 0 clamp(18px, 5vw, 72px); border-bottom: 1px solid #d8e1da; background: rgba(255,255,255,.9); }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 3px; background: #176b52; color: #fff; font-size: 12px; }
        .header-actions { display: flex; align-items: center; gap: 12px; color: #64736b; font-size: 13px; }
        button { border: 1px solid #b9c9be; border-radius: 3px; padding: 8px 12px; background: #fff; color: #176b52; font: inherit; cursor: pointer; }
        button:hover { border-color: #176b52; }
        main { width: min(1240px, calc(100% - 32px)); margin: 28px auto; }
        .workspace { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 680px; overflow: hidden; border: 1px solid #d8e1da; border-radius: 6px; background: rgba(255,255,255,.94); box-shadow: 0 14px 36px rgba(34, 63, 45, .08); }
        .sidebar { border-right: 1px solid #d8e1da; background: #f8faf8; }
        .sidebar-head, .chat-head { padding: 22px; border-bottom: 1px solid #d8e1da; }
        h1, h2, p { margin: 0; }
        h1 { font-size: 22px; }
        .sidebar-head p, .chat-subtitle { margin-top: 6px; color: #718078; font-size: 13px; }
        .new-thread { width: calc(100% - 32px); margin: 16px; background: #176b52; color: #fff; border-color: #176b52; }
        .conversation-list { display: grid; }
        .conversation { display: block; width: 100%; padding: 15px 18px; border: 0; border-top: 1px solid #e5ebe6; border-radius: 0; text-align: left; background: transparent; color: inherit; }
        .conversation.active, .conversation:hover { background: #e5f0e8; }
        .conversation-title { display: block; overflow: hidden; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
        .conversation-meta { display: block; margin-top: 5px; color: #718078; font-size: 12px; }
        .chat { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
        .chat-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
        .chat-head h2 { font-size: 19px; }
        .messages { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; padding: 26px clamp(18px, 4vw, 44px); background: #fcfdfc; }
        .empty { margin: auto; max-width: 330px; text-align: center; color: #718078; }
        .message { max-width: min(72%, 620px); padding: 12px 15px; border: 1px solid #d9e4dc; border-radius: 5px; background: #fff; }
        .message.mine { align-self: flex-end; border-color: #b8d7c2; background: #e8f4eb; }
        .message-author { color: #176b52; font-size: 12px; font-weight: 700; }
        .message-body { margin-top: 6px; line-height: 1.45; white-space: pre-wrap; }
        .message-time { display: block; margin-top: 8px; color: #829087; font-size: 11px; }
        .composer { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 18px 22px; border-top: 1px solid #d8e1da; background: #fff; }
        .compose-field { position: relative; min-width: 0; }
        .mention-menu { position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 2; display: grid; min-width: 210px; overflow: hidden; border: 1px solid #cbd9cf; border-radius: 4px; background: #fff; box-shadow: 0 8px 20px rgba(23,35,30,.14); }
        .mention-menu[hidden] { display: none; }
        .mention-option { width: 100%; border: 0; border-bottom: 1px solid #edf1ed; border-radius: 0; padding: 10px 12px; text-align: left; color: #17231e; }
        .mention-option:last-child { border-bottom: 0; }
        .mention-option:hover, .mention-option:focus { background: #e8f4eb; outline: none; }
        textarea { width: 100%; min-height: 42px; max-height: 120px; resize: vertical; border: 1px solid #b9c9be; border-radius: 3px; padding: 11px; font: inherit; }
        dialog { width: min(440px, calc(100% - 32px)); border: 1px solid #d8e1da; border-radius: 5px; padding: 24px; box-shadow: 0 16px 40px rgba(23,35,30,.2); }
        dialog::backdrop { background: rgba(23,35,30,.3); }
        form { display: grid; gap: 12px; margin-top: 18px; }
        label { display: grid; gap: 5px; color: #64736b; font-size: 13px; }
        input, select { width: 100%; border: 1px solid #b9c9be; border-radius: 3px; padding: 10px; background: #fff; font: inherit; }
        .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 5px; }
        .error { min-height: 18px; color: #a13d2d; font-size: 13px; }
        @media (max-width: 720px) { main { width: 100%; margin: 0; } .workspace { grid-template-columns: 1fr; min-height: calc(100vh - 68px); border: 0; border-radius: 0; } .sidebar { min-height: 230px; border-right: 0; border-bottom: 1px solid #d8e1da; } .message { max-width: 88%; } }
    </style>
</head>
<body>
<header>
    <div class="brand"><span class="brand-mark">ITC</span><span>Collaboration</span></div>
    <div class="header-actions"><span id="identity">Loading session...</span><button id="logout">Log off</button></div>
</header>
<main>
    <section class="workspace" aria-label="Collaboration workspace">
        <aside class="sidebar">
            <div class="sidebar-head"><h1>Conversations</h1><p>Vendor and ITC support threads</p></div>
            <button id="new-thread" class="new-thread">New conversation</button>
            <div id="conversation-list" class="conversation-list"></div>
        </aside>
        <section class="chat" aria-label="Conversation">
            <div class="chat-head"><div><h2 id="thread-title">Select a conversation</h2><p id="thread-meta" class="chat-subtitle">Choose a thread or start a new one.</p></div><span id="thread-status" class="chat-subtitle"></span></div>
            <div id="messages" class="messages"><p class="empty">Your conversations with ITC employees will appear here.</p></div>
            <form id="composer" class="composer" hidden><div class="compose-field"><textarea id="message-text" placeholder="Write a message..." aria-label="Message" required></textarea><div id="mention-menu" class="mention-menu" role="listbox" hidden></div></div><button type="submit">Send</button></form>
        </section>
    </section>
</main>
<dialog id="thread-dialog">
    <h2>Start a conversation</h2>
    <form id="thread-form">
        <label>Subject <input name="subject" maxlength="500" required></label>
        <label>Category <select name="category"><option>OTHER</option><option>INVOICE</option><option>PAYMENT</option><option>PO</option><option>DELIVERY</option><option>GST</option></select></label>
        <label>Priority <select name="priority"><option>MEDIUM</option><option>LOW</option><option>HIGH</option></select></label>
        <label>Message <textarea name="description" required></textarea></label>
        <div id="thread-error" class="error"></div>
        <div class="form-actions"><button type="button" id="cancel-thread">Cancel</button><button type="submit">Create conversation</button></div>
    </form>
</dialog>
<script>
    let session;
    let serviceRoot;
    let threads = [];
    let selectedId;
    let mentionStart = -1;
    const $ = id => document.getElementById(id);
    const escapeOData = value => String(value).replace(/'/g, "''");
    const formatTime = value => value ? new Date(value).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';

    async function api(path, options = {}) {
        const response = await fetch(`${serviceRoot}${path}`, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
        if (!response.ok) throw new Error(await response.text());
        return response.status === 204 ? null : response.json();
    }

    function renderThreads() {
        $('conversation-list').innerHTML = threads.length ? threads.map(thread => `<button class="conversation ${thread.ID === selectedId ? 'active' : ''}" data-id="${thread.ID}"><span class="conversation-title">${thread.subject || thread.queryNumber || 'Untitled conversation'}</span><span class="conversation-meta">${thread.status || 'OPEN'} · ${thread.category || 'OTHER'}</span></button>`).join('') : '<p class="empty" style="padding:20px">No conversations yet.</p>';
        document.querySelectorAll('.conversation').forEach(button => button.onclick = () => selectThread(button.dataset.id));
    }

    function renderMessages(thread) {
        $('thread-title').textContent = thread.subject || thread.queryNumber || 'Conversation';
        $('thread-meta').textContent = `${thread.category || 'OTHER'} · ${thread.priority || 'MEDIUM'} · ${thread.queryNumber || ''}`;
        $('thread-status').textContent = thread.status || 'OPEN';
        $('composer').hidden = false;
        const messages = thread.messages || [];
        $('messages').innerHTML = messages.length ? messages.map(message => `<article class="message ${message.senderName === session.username ? 'mine' : ''}"><div class="message-author">${message.senderName || message.senderType || 'ITC'}</div><div class="message-body">${message.message || ''}</div><time class="message-time">${formatTime(message.createdAt)}</time></article>`).join('') : '<p class="empty">No messages yet. Start the conversation below.</p>';
        $('messages').scrollTop = $('messages').scrollHeight;
    }

    async function loadThreads() {
        const result = await api('/VendorQueries?$expand=messages&$orderby=createdAt desc');
        threads = result.value || [];
        renderThreads();
        if (threads.length) selectThread(threads[0].ID);
    }

    function selectThread(id) {
        selectedId = id;
        renderThreads();
        const thread = threads.find(item => item.ID === id);
        if (thread) renderMessages(thread);
    }

    function mentionCandidates() {
        return session.isAdmin
            ? [{ name: 'vendor1', label: 'vendor1 · Vendor' }, { name: 'vendor2', label: 'vendor2 · Vendor' }]
            : [{ name: 'admin1', label: 'admin1 · ITC employee' }, { name: 'ITC-Team', label: 'ITC-Team · Support' }];
    }

    function updateMentionMenu() {
        const input = $('message-text');
        const beforeCursor = input.value.slice(0, input.selectionStart);
        const match = beforeCursor.match(/(?:^|\s)@([\w-]*)$/);
        if (!match) { $('mention-menu').hidden = true; return; }
        mentionStart = beforeCursor.length - match[1].length - 1;
        const query = match[1].toLowerCase();
        const options = mentionCandidates().filter(candidate => candidate.name.toLowerCase().startsWith(query));
        $('mention-menu').innerHTML = options.map(candidate => `<button type="button" class="mention-option" role="option" data-name="${candidate.name}">@${candidate.name}<small> ${candidate.label}</small></button>`).join('');
        $('mention-menu').hidden = options.length === 0;
        document.querySelectorAll('.mention-option').forEach(option => option.onclick = () => {
            const end = input.selectionStart;
            input.value = `${input.value.slice(0, mentionStart)}@${option.dataset.name} ${input.value.slice(end)}`;
            input.focus();
            input.setSelectionRange(mentionStart + option.dataset.name.length + 2, mentionStart + option.dataset.name.length + 2);
            $('mention-menu').hidden = true;
        });
    }

    $('new-thread').onclick = () => { $('thread-error').textContent = ''; $('thread-dialog').showModal(); };
    $('cancel-thread').onclick = () => $('thread-dialog').close();
    $('message-text').addEventListener('input', updateMentionMenu);
    $('message-text').addEventListener('click', updateMentionMenu);
    $('message-text').addEventListener('keyup', updateMentionMenu);
    $('thread-form').onsubmit = async event => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(event.target));
        try {
            const created = await api('/VendorQueries', { method: 'POST', body: JSON.stringify(data) });
            await api('/QueryMessages', { method: 'POST', body: JSON.stringify({ query_ID: created.ID, senderType: session.isAdmin ? 'ITC' : 'VENDOR', senderName: session.username, message: data.description }) });
            $('thread-dialog').close(); event.target.reset(); await loadThreads();
        } catch (error) { $('thread-error').textContent = 'Unable to create the conversation.'; }
    };
    $('composer').onsubmit = async event => {
        event.preventDefault();
        const text = $('message-text').value.trim();
        if (!text || !selectedId) return;
        await api('/QueryMessages', { method: 'POST', body: JSON.stringify({ query_ID: selectedId, senderType: session.isAdmin ? 'ITC' : 'VENDOR', senderName: session.username, message: text }) });
        $('message-text').value = '';
        await loadThreads(); selectThread(selectedId);
    };
    $('logout').onclick = async () => { await fetch('/auth/logout', { method: 'POST' }); location.href = '/'; };

    (async () => {
        const response = await fetch('/auth/session');
        const data = await response.json();
        if (!data.signedIn) { location.href = '/'; return; }
        session = { ...data, isAdmin: data.roles.some(role => ['admin', 'approver', 'finance', 'treasury'].includes(role)) };
        serviceRoot = session.isAdmin ? '/api/admin' : '/api/vendor';
        $('identity').textContent = `${session.username} · ${session.isAdmin ? 'ITC employee' : 'Vendor'}`;
        try { await loadThreads(); } catch (error) { $('messages').innerHTML = '<p class="empty">Unable to load conversations. Please refresh.</p>'; }
    })();
</script>
</body>
</html>
