_schema-version: '3.1'
ID: itc-vendor-portal
version: 1.0.0
description: ITC Vendor Collaboration Portal
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  # ──── CAP Backend Service ────
  - name: itc-vendor-portal-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: itc-vendor-portal-auth
      - name: itc-vendor-portal-db
      - name: itc-vendor-portal-dest
      - name: itc-vendor-portal-conn

  # ──── HANA Cloud DB Deployer ────
  - name: itc-vendor-portal-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: itc-vendor-portal-db

  # ──── Managed Approuter (UI) ────
  - name: itc-vendor-portal-app
    type: approuter.nodejs
    path: app
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv
          url: ~{srv-url}
          forwardAuthToken: true
      - name: itc-vendor-portal-auth

resources:
  # ──── XSUAA ────
  - name: itc-vendor-portal-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ──── HANA Cloud ────
  - name: itc-vendor-portal-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ──── Destination Service ────
  - name: itc-vendor-portal-dest
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations: []

  # ──── Connectivity Service ────
  - name: itc-vendor-portal-conn
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
